name: Build executable demo
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sh build.sh
      - run: |
          mkdir demo
          cp target/satellite-mission-planner-1.0.0.jar run.sh run.bat README.md demo/
          cd demo && zip -r ../satellite-mission-planner-demo.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: executable-demo
          path: satellite-mission-planner-demo.zip
