name: Publish executable release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sh build.sh
      - name: Package executable
        run: |
          mkdir demo
          cp target/satellite-mission-planner-2.0.0.jar run.sh run.bat README.md demo/
          cp -R docs demo/
          cd demo
          zip -r ../satellite-mission-planner-demo.zip .
          cd ..
          sha256sum satellite-mission-planner-demo.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.0.0 > /dev/null 2>&1; then
            gh release create v2.0.0 --target "$GITHUB_SHA" --title "v2.0.0 — Orbit Operations executable demo" --notes-file docs/RELEASE.md
          fi
          gh release upload v2.0.0 satellite-mission-planner-demo.zip SHA256SUMS.txt --clobber
          gh release edit v2.0.0 --draft=false
